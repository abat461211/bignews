<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIGNEWS — новини України та світу</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a1d24;
    --muted: #6b7280;
    --accent: #e63946;
    --accent2: #1d3557;
    --border: #e5e7eb;
  }
  [data-theme="dark"] {
    --bg: #12141a;
    --card: #1c1f28;
    --text: #e8eaf0;
    --muted: #9aa1b0;
    --border: #2c3040;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .3s, color .3s;
  }
  .topbar {
    background: var(--accent2);
    color: #fff;
    font-size: 13px;
    padding: 6px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .topbar span { opacity: .85; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .topbar button {
    background: rgba(255,255,255,.15);
    color: #fff;
    border: none;
    padding: 4px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    flex-shrink: 0;
    margin-left: 8px;
  }
  header.main {
    background: var(--card);
    border-bottom: 3px solid var(--accent);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { font-size: 24px; font-weight: 900; letter-spacing: 1px; white-space: nowrap; }
  .logo b { color: var(--accent); }
  .logo span { color: var(--accent2); }
  .burger {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 20px;
    width: 40px; height: 40px;
    border-radius: 8px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
  }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    transition: all .2s;
  }
  nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  nav button:hover { border-color: var(--accent); }
  .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .breaking {
    background: var(--accent);
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 14px;
    font-weight: 600;
  }
  .breaking .label {
    background: #fff;
    color: var(--accent);
    padding: 2px 10px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .main-news { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 20px; }
  .hero {
    background: linear-gradient(135deg, #1d3557, #2b4a7a);
    color: #fff;
    border-radius: 12px;
    padding: 24px;
    min-height: 260px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .hero::after {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(230,57,70,.35);
  }
  .hero .tag { font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #ffd166; margin-bottom: 8px; }
  .hero h2 { font-size: clamp(20px, 3vw, 32px); line-height: 1.2; margin-bottom: 8px; }
  .hero p { opacity: .9; font-size: 14px; max-width: 600px; }
  .hero .meta { margin-top: 12px; font-size: 12px; opacity: .7; }
  .side-list { display: flex; flex-direction: column; gap: 10px; }
  .side-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .side-item:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  .side-item .num { color: var(--accent); font-weight: 900; font-size: 13px; }
  .side-item h4 { font-size: 14px; margin: 6px 0 4px; line-height: 1.35; }
  .side-item .meta { font-size: 11px; color: var(--muted); }
  .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    display: flex;
    flex-direction: column;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
  .thumb {
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    color: #fff;
  }
  .thumb.photo { padding: 0; overflow: hidden; }
  .thumb.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .body { padding: 14px; display: flex; flex-direction: column; flex: 1; }
  .card .cat { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; }
  .card h3 { font-size: 16px; margin: 8px 0; line-height: 1.35; }
  .card p { font-size: 13px; color: var(--muted); line-height: 1.5; flex: 1; }
  .card .meta { margin-top: 10px; font-size: 11px; color: var(--muted); }

  /* ====== СТОРІНКА СТАТТІ ====== */
  #article-view { display: none; animation: fadein .3s; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .back-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    margin-bottom: 16px;
    transition: all .2s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .article {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    max-width: 860px;
    margin: 0 auto;
  }
  .article-hero {
    min-height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 28px;
    color: #fff;
    position: relative;
  }
  .article-hero .cat { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; opacity: .95; margin-bottom: 10px; }
  .article-hero h1 { font-size: clamp(22px, 4vw, 36px); line-height: 1.25; }
  .article-body { padding: 24px 28px; }
  .article-meta { font-size: 13px; color: var(--muted); margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 14px; }
  .article-body p { font-size: 16px; line-height: 1.75; color: var(--text); margin-bottom: 16px; }
  .article-body blockquote {
    border-left: 4px solid var(--accent);
    background: rgba(230,57,70,.06);
    padding: 14px 18px;
    margin: 20px 0;
    font-style: italic;
    border-radius: 0 8px 8px 0;
    color: var(--text);
  }
  .article-body h3 { font-size: 20px; margin: 24px 0 10px; }
  .article-body h2 { font-size: 22px; margin: 28px 0 12px; line-height: 1.35; }
  .article-img { width: 100%; height: auto; border-radius: 10px; margin: 4px 0 20px; display: block; }
  .article-body ul { padding-left: 22px; margin: 12px 0 16px; line-height: 1.7; font-size: 16px; }
  .article-body .emoji-lg { font-size: 56px; text-align: center; margin: 16px 0; }
  .article-body a, .card a { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--accent); }
  .article-body a:hover, .card a:hover { opacity: .8; }
  .article-body a:visited, .card a:visited { color: var(--accent); }
  .related-title { font-size: 18px; font-weight: 800; margin: 28px 0 14px; }
  .related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }

  /* ====== ПАГІНАЦІЯ ====== */
  .pagination { display: flex; justify-content: center; gap: 8px; margin: 24px 0 8px; flex-wrap: wrap; }
  .page-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    min-width: 42px; height: 42px;
    padding: 0 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all .2s;
  }
  .page-btn:hover:not(:disabled):not(.active) { border-color: var(--accent); color: var(--accent); }
  .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .page-btn:disabled { opacity: .4; cursor: default; }

  footer {
    background: var(--accent2);
    color: #cdd6e4;
    text-align: center;
    padding: 22px 16px;
    margin-top: 28px;
    font-size: 13px;
  }
  footer b { color: #fff; }
  .cat-tech { color: #3a86ff; }
  .cat-world { color: #ff9e00; }
  .cat-econ { color: #06d6a0; }
  .cat-sport { color: #ef476f; }
  .cat-science { color: #9b5de5; }
  .cat-ukr { color: #1d9bf0; }
  .pulse { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  /* ====== МОБІЛКА ====== */
  @media (max-width: 860px) {
    .main-news { grid-template-columns: 1fr; }
    .burger { display: flex; }
    nav {
      display: none;
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
      padding: 10px 16px;
      flex-direction: column;
      gap: 4px;
    }
    nav.open { display: flex; }
    nav button { width: 100%; text-align: left; padding: 12px 14px; border-radius: 8px; font-size: 15px; }
    .hero { min-height: 220px; padding: 20px; }
    .article-hero { min-height: 180px; padding: 20px; }
    .article-body { padding: 18px; }
    .article-body p { font-size: 15px; line-height: 1.7; }
    .topbar { font-size: 12px; padding: 5px 12px; }
    .logo { font-size: 20px; }
    .breaking { font-size: 13px; }
    .breaking .label { font-size: 10px; padding: 2px 8px; }
    .container { padding: 12px; }
    .thumb { height: 130px; }
  }
  @media (max-width: 480px) {
    .hero h2 { font-size: 20px; }
    .card h3 { font-size: 15px; }
    .news-grid { grid-template-columns: 1fr; }
    .topbar span { max-width: 65vw; }
  }
</style>
</head>
<body data-theme="light">

<div class="topbar">
  <span id="topbar-text">BIGNEWS</span>
  <button onclick="toggleTheme()">🌙 Темна</button>
</div>

<header class="main">
  <div class="logo"><b>BIG</b><span>NEWS</span></div>
  <button class="burger" id="burger" onclick="toggleMenu()">☰</button>
  <nav id="nav">
    <button class="active" data-cat="all">Всі</button>
    <button data-cat="ukr">Україна</button>
    <button data-cat="world">Світ</button>
    <button data-cat="tech">Техно</button>
    <button data-cat="econ">Економіка</button>
    <button data-cat="science">Наука</button>
    <button data-cat="sport">Спорт</button>
  </nav>
</header>

<!-- ГОЛОВНА -->
<div class="container" id="home-view">

  <div class="breaking" id="breaking" style="display:none">
    <span class="label pulse" id="breaking-label">🔴 LIVE</span>
    <span id="breaking-text"></span>
  </div>

  <div class="main-news" id="main-news">
  </div>

  <div class="news-grid" id="grid"></div>
</div>

<!-- СТАТТЯ -->
<div class="container" id="article-view">
  <button class="back-btn" onclick="closeArticle()">← Назад до новин</button>
  <div class="article" id="article-content"></div>
  <h3 class="related-title">Читайте також</h3>
  <div class="related-grid" id="related-grid"></div>
</div>

<footer>
  <b>BIGNEWS.news</b> — навчальний новинний портал.<br>
  Усі матеріали — демонстраційний контент для показу верстки. © 2026
</footer>

<script>
let NEWS = [];
let SITE_CFG = { topbar: 'BIGNEWS', breakingLabel: '🔴 LIVE', breakingText: '', heroTitle: 'Головне за день', heroId: null };

fetch('news.json')
  .then(r => r.json())
  .then(data => { NEWS = data; render(); })
  .catch(() => { document.getElementById('grid').innerHTML = '<p style="padding:20px">Не вдалося завантажити новини.</p>'; });

fetch('config.json')
  .then(r => r.json())
  .then(cfg => {
    SITE_CFG = Object.assign({}, SITE_CFG, cfg);
    document.getElementById('topbar-text').textContent = SITE_CFG.topbar || 'BIGNEWS';
    const br = document.getElementById('breaking');
    if (SITE_CFG.breakingText) {
      document.getElementById('breaking-label').textContent = SITE_CFG.breakingLabel || '🔴 LIVE';
      document.getElementById('breaking-text').textContent = SITE_CFG.breakingText;
      br.style.display = '';
    }
    renderMain();
  })
  .catch(() => {});
</script>
<script>


const CATS = { all: 'Всі', ukr: 'Україна', world: 'Світ', tech: 'Техно', econ: 'Економіка', science: 'Наука', sport: 'Спорт' };
const CAT_CLASS = { tech: 'cat-tech', world: 'cat-world', econ: 'cat-econ', sport: 'cat-sport', science: 'cat-science', ukr: 'cat-ukr' };
let currentCat = 'all';
const PAGE_SIZE = 12;
let currentPage = 1;
let savedScroll = 0;

function timeAgo(min) {
  return min < 60 ? `${min} хв тому` : `${Math.floor(min/60)} год ${min%60 ? min%60 + ' хв' : ''} тому`;
}

function linkify(s) {
  // 1) [текст](https://url) — явне посилання з текстом
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 2) голі URL — обгортаємо в посилання (не чіпаємо вже згенеровані <a href="...")
  s = s.replace(/(^|[\s>])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s;
}

function cardHTML(n, i) {
  const mins = (i * 47 + 13) % 600;
  const thumbHtml = n.img
    ? `<div class="thumb photo"><img src="${n.img}" alt="${n.title}" loading="lazy"></div>`
    : `<div class="thumb" style="background:${n.color}">${n.emoji}</div>`;
  return `
  <div class="card" onclick="openArticle(${n.id})">
    ${thumbHtml}
    <div class="body">
      <div class="cat ${CAT_CLASS[n.cat]}">${CATS[n.cat]}</div>
      <h3>${n.title}</h3>
      <p>${linkify(n.text)}</p>
      <div class="meta">🕒 ${timeAgo(mins)} • 👁 ${viewsCount(n.id).toLocaleString('uk-UA')} читань</div>
    </div>
  </div>`;
}

function render() {
  const grid = document.getElementById('grid');
  const items = NEWS
    .filter(n => currentCat === 'all' || n.cat === currentCat)
    .sort((a, b) => b.id - a.id); // нові статті — зверху
  const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  const pageItems = items.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);
  grid.innerHTML = pageItems.map(cardHTML).join('');
  renderPagination(totalPages);
}

// ====== ГОЛОВНИЙ БЛОК (hero + side-list) ======
function renderMain() {
  const wrap = document.getElementById('main-news');
  if (!wrap || !NEWS.length) return;
  const sorted = NEWS.slice().sort((a, b) => b.id - a.id);
  let hero = null;
  if (SITE_CFG.heroId) hero = NEWS.find(n => n.id === SITE_CFG.heroId) || null;
  if (!hero) hero = sorted[0];
  const side = sorted.filter(n => n.id !== hero.id).slice(0, 4);

  const heroMins = (hero.id * 47 + 13) % 600;
  const heroImg = hero.img
    ? `<img src="${hero.img}" alt="${hero.title}" style="width:100%;height:auto;border-radius:10px;margin-top:12px;display:block;">`
    : '';
  wrap.innerHTML = `
    <div class="hero" onclick="openArticle(${hero.id})">
      <div class="tag">${SITE_CFG.heroTitle || 'Головне за день'}</div>
      <h2>${hero.title}</h2>
      <p>${hero.text}</p>
      ${heroImg}
      <div class="meta">${hero.emoji || '📰'} ${CATS[hero.cat] || hero.cat} • ${timeAgo(heroMins)} • 👁 ${viewsCount(hero.id).toLocaleString('uk-UA')} читань</div>
    </div>
    <div class="side-list">
      ${side.map((n, i) => `
        <div class="side-item" onclick="openArticle(${n.id})">
          <div class="num">${String(i + 1).padStart(2, '0')}</div>
          <h4>${n.title}</h4>
          <div class="meta">${n.emoji || '📰'} ${CATS[n.cat] || n.cat} • ${timeAgo((n.id * 47 + 13) % 600)}</div>
        </div>`).join('')}
    </div>`;
}

// ====== ЛІЧИЛЬНИК ПЕРЕГЛЯДІВ (localStorage) ======
function viewsGet(id) {
  try {
    const store = JSON.parse(localStorage.getItem('bignews_views') || '{}');
    return store[id] || 0;
  } catch (e) { return 0; }
}
function viewsInc(id) {
  try {
    const store = JSON.parse(localStorage.getItem('bignews_views') || '{}');
    store[id] = (store[id] || 0) + 1;
    localStorage.setItem('bignews_views', JSON.stringify(store));
  } catch (e) {}
}
function viewsCount(id) {
  return (id * 137 + 500) + viewsGet(id);
}

function renderPagination(totalPages) {
  let bar = document.getElementById('pagination');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'pagination';
    document.getElementById('grid').after(bar);
  }
  if (totalPages <= 1) { bar.innerHTML = ''; return; }
  let html = `<button class="page-btn" onclick="gotoPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← Назад</button>`;
  for (let p = 1; p <= totalPages; p++) {
    html += `<button class="page-btn ${p === currentPage ? 'active' : ''}" onclick="gotoPage(${p})">${p}</button>`;
  }
  html += `<button class="page-btn" onclick="gotoPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Далі →</button>`;
  bar.innerHTML = html;
}

function gotoPage(p) {
  currentPage = p;
  render();
  const el = document.getElementById('grid');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ====== НАВІГАЦІЯ ======
function showHome() {
  document.getElementById('home-view').style.display = 'block';
  document.getElementById('article-view').style.display = 'none';
  window.scrollTo({ top: savedScroll, behavior: 'smooth' });
}

function openArticle(id) {
  savedScroll = window.scrollY;
  const n = NEWS.find(x => x.id === id);
  if (!n) return;
  viewsInc(id);
  document.getElementById('home-view').style.display = 'none';
  document.getElementById('article-view').style.display = 'block';

  const related = NEWS.filter(x => x.id !== n.id && x.cat === n.cat).slice(0, 3);
  const fallback = NEWS.filter(x => x.id !== n.id).slice(0, 3);
  const relList = (related.length ? related : fallback);

  const imgBlock = n.img ? `<img src="${n.img}" alt="${n.title}" class="article-img">` : '';
  const bodyHtml = n.paragraphs.map(p => p.startsWith('## ')
    ? `<h2>${linkify(p.slice(3))}</h2>`
    : `<p>${linkify(p)}</p>`).join('');

  document.getElementById('article-content').innerHTML = `
    <div class="article-hero" style="background:linear-gradient(135deg, ${n.color}, ${n.color}cc)">
      <div class="cat">${CATS[n.cat]}</div>
      <h1>${n.title}</h1>
    </div>
    <div class="article-body">
      <div class="article-meta">
        <span>🕒 ${timeAgo(37)}</span>
        <span>👁 ${viewsCount(n.id).toLocaleString('uk-UA')} читань</span>
        <span>✍️ Редакція BIGNEWS</span>
      </div>
      ${imgBlock}
      ${bodyHtml}
      <blockquote>${n.quote}</blockquote>
      <h3>Ключове в цифрах</h3>
      <ul>${n.points.map(p => `<li>${p}</li>`).join('')}</ul>
    </div>`;

  document.getElementById('related-grid').innerHTML = relList.map((x, i) => cardHTML(x, i)).join('');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function closeArticle() { showHome(); }

// ====== ФІЛЬТРИ ======
document.getElementById('nav').addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#nav button').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  currentCat = e.target.dataset.cat;
  currentPage = 1;
  render();
  document.getElementById('nav').classList.remove('open');
});

// ====== МОБІЛЬНЕ МЕНЮ ======
function toggleMenu() {
  document.getElementById('nav').classList.toggle('open');
}

// ====== ТЕМА ======
function toggleTheme() {
  const body = document.body;
  body.dataset.theme = body.dataset.theme === 'light' ? 'dark' : 'light';
  document.querySelector('.topbar button').textContent =
    body.dataset.theme === 'light' ? '🌙 Темна' : '☀️ Світла';
}
</script>
</body>
</html>
